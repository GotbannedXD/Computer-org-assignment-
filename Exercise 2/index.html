<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wina Bwangu - FinTech Operations Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-brand">Wina Bwangu FinTech</div>
    <ul class="nav-links">
      <li><a href="#transaction-section" class="active">New Transaction</a></li>
      <li><a href="dashboard.html">Agent Dashboard</a></li>
    </ul>
  </nav>

  <!-- Notification Toast Container -->
  <div id="toast-container"></div>

  <main class="container">
    <!-- Transaction Entry Form -->
    <section id="transaction-section" class="card">
      <h2>Record Mobile Booth Transaction</h2>
      <form id="transactionForm">
        
        <div class="form-group">
          <label for="transactionId">Transaction ID</label>
          <input type="text" id="transactionId" readonly placeholder="Auto-generating...">
        </div>

        <div class="form-group">
          <label for="boothSelect">Select Mobile Booth</label>
          <select id="boothSelect" required>
            <option value="">-- Choose Mobile Booth --</option>
            <option value="Wina1">Wina1</option>
            <option value="Wina2">Wina2</option>
            <option value="Wina3">Wina3</option>
            <option value="Wina4">Wina4</option>
            <option value="Wina5">Wina5</option>
            <option value="Wina6">Wina6</option>
          </select>
        </div>

        <div class="form-group">
          <label for="locationInput">Location</label>
          <input type="text" id="locationInput" readonly placeholder="Location will appear here...">
        </div>

        <div class="form-group">
          <label for="serviceSelect">Select Service</label>
          <select id="serviceSelect" required disabled>
            <option value="">-- Select Booth First --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="revenueRate">Revenue Per Kwacha (ZMW)</label>
          <input type="text" id="revenueRate" readonly placeholder="0.00">
        </div>

        <div class="form-group">
          <label for="transactionAmount">Transaction Amount (ZMW)</label>
          <input type="number" id="transactionAmount" min="1" step="0.01" placeholder="e.g. 500" required>
        </div>

        <button type="submit" class="btn-primary">Execute Transaction</button>
      </form>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
